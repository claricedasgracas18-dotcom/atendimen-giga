<!-- MODAL -->

<div class="modal" id="modal">

    <div class="modal-content">

        <span class="fechar" onclick="fecharModal()">×</span>

        <h2 id="modalTitulo"></h2>

        <p id="modalTexto"></p>

        <a
            href="#"
            class="botao"
            id="modalBotao"
            target="_blank"
            rel="noopener noreferrer"
        >
            💬 Abrir WhatsApp
        </a>

    </div>

</div>


<script>

    // Número do WhatsApp
    const numeroWhatsApp = "5569920022874";


    function abrirModal(tipo) {

        const modal = document.getElementById("modal");
        const titulo = document.getElementById("modalTitulo");
        const texto = document.getElementById("modalTexto");
        const botao = document.getElementById("modalBotao");


        if (tipo === "atendimento") {

            titulo.innerText = "Atendimento";

            texto.innerText =
                "Entre em contato com nossa equipe para receber ajuda e tirar suas dúvidas.";

            const mensagem =
                "Olá! Gostaria de falar com o atendimento da Giga+.";

            botao.href =
                "https://wa.me/" +
                numeroWhatsApp +
                "?text=" +
                encodeURIComponent(mensagem);
        }


        if (tipo === "fatura") {

            titulo.innerText = "Sua Fatura";

            texto.innerText =
                "Consulte sua fatura, veja o vencimento ou solicite uma segunda via.";

            const mensagem =
                "Olá! Gostaria de consultar minha fatura da Giga+.";

            botao.href =
                "https://wa.me/" +
                numeroWhatsApp +
                "?text=" +
                encodeURIComponent(mensagem);
        }


        if (tipo === "suporte") {

            titulo.innerText = "Suporte Técnico";

            texto.innerText =
                "Nossa equipe pode ajudar você com problemas relacionados à sua internet e equipamentos.";

            const mensagem =
                "Olá! Preciso de suporte técnico com minha internet/equipamento da Giga+.";

            botao.href =
                "https://wa.me/" +
                numeroWhatsApp +
                "?text=" +
                encodeURIComponent(mensagem);
        }


        if (tipo === "conexao") {

            titulo.innerText = "Sem Conexão";

            texto.innerText =
                "Vamos ajudar você a identificar o problema. Clique abaixo para falar com nosso suporte.";

            const mensagem =
                "Olá! Estou sem conexão com a internet e preciso de ajuda.";

            botao.href =
                "https://wa.me/" +
                numeroWhatsApp +
                "?text=" +
                encodeURIComponent(mensagem);
        }


        modal.style.display = "flex";
    }


    function fecharModal() {

        document.getElementById("modal").style.display = "none";

    }


    window.onclick = function(event) {

        const modal = document.getElementById("modal");

        if (event.target === modal) {

            fecharModal();

        }

    }

</script>
